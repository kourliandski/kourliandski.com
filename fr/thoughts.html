<!doctype html><html lang="fr" data-source="thoughts.html"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réflexions & citations — Dmitri Kourliandski</title><script src="/fr/thoughts-fr-1.js"></script><script src="/fr/thoughts-fr-2.js"></script><script src="/fr/thoughts-fr-3.js"></script></head><body><script src="/fr/mirror.js?v=20260915-diary-contact-2"></script><script>(()=>{const apply=()=>{if(!window.TH_FR)return;let busy=false;const translate=()=>{if(busy)return;busy=true;document.querySelectorAll('.card').forEach(c=>{const label=c.querySelector('.label')?.textContent?.trim();if(label&&TH_FR[label]){const box=c.querySelector('.text');if(box&&box.dataset.frTranslated!==label){if(label==='00')box.innerHTML='<h1 class="diary-title">Réflexions &amp; citations<span>Journal interactif</span></h1>'+TH_FR[label]+'<p><br><strong>mode de lecture :</strong> touchez ou cliquez n’importe où sur l’écran pour tirer une page. Les pages apparaissent dans un ordre aléatoire et ne se répètent pas avant l’épuisement du jeu.</p>';else box.innerHTML='<div class="auto-translation-note"><em>Traduction automatique de l’anglais.</em></div><div class="translation-spacer" aria-hidden="true">&nbsp;</div><div class="translated-entry">'+TH_FR[label]+'</div>';box.dataset.frTranslated=label}}});busy=false};translate();new MutationObserver(m=>{if(m.some(x=>[...x.addedNodes].some(n=>n.nodeType===1&&(n.matches?.('.card')||n.querySelector?.('.card')))))translate()}).observe(document.body,{childList:true,subtree:true})};setTimeout(apply,500)})()</script><style>.auto-translation-note{display:block!important;margin:0!important;padding:0!important;font-family:Arial,Helvetica,sans-serif;font-size:10px;line-height:1.3;letter-spacing:.03em;color:#777}.translation-spacer{display:block!important;height:24px!important;min-height:24px!important;line-height:24px!important;font-size:1px!important}.translated-entry{display:block!important}</style></body></html>
