const SOURCE='https://api.github.com/repos/kourliandski/kourliandski.com/git/blobs/1b9231d4bbb24a7ce63c44624428e274f5ebd94f';
const NEW_CARDS=[
{label:'41',html:`<p>silence is an omission of time. where there is no sound, only pure, indivisible time remains. where there is no sound, only we remain. we encounter ourselves and become the content of time.</p><p>a gap, a pause, is a territory of freedom. through it, a person's inner world breaks through. it cannot be controlled from outside, and therefore it poses a threat to the external world.</p><p>every composer composes not only sounds, but silence. silence does not exist, so it has to be recomposed each time. it can be as individual as melody, rhythm, harmony, or form.</p>`},
{label:'42',html:`<p>music is heard time. memory abolishes linear time: events remain simultaneously present, like objects in space. perhaps time is only an attribute of perception — a consequence of our inability to embrace simultaneity, the eternal present.</p>`},
{label:'43',html:`<p>the moment i say “i know,” i close off the possibility of knowing.</p>`},
{label:'44',html:`<p>a string quartet is not only four instruments: it is four living people on stage, many more people in the hall, and even those who did not manage to enter the hall. all of this is also a string quartet.</p>`},
{label:'45',html:`<p>there is no music. there is, perhaps, an ever-expanding sum of ideas about what music is. to make music is therefore to deal with something that does not exist — with the unknown.</p><p>music gives us the possibility of encountering the unknown, inhabiting it, recognizing ourselves within it, and finally accepting it. fear of the unknown fuels wars.</p>`},
{label:'46',html:`<p>my guilty pleasure is ambient dub. i see it as a study of the displacement of emphasis from the event to the space in which it exists — to the properties of that space.</p><p>another feature is the disproportion between the minimal event (almost a non-event) and its resonance (often massive and layered). the event is needed to reveal the space, like light is needed to see in the dark.</p><p>the “beat,” the repetition, is interesting here not as a dance function, but as a property of the object — its discrete, lasting presence, like a twinkling star.</p><p>finally, the listener finds themselves somewhere between the distant (disappearing) object and the expanding space. no fetishization of the object's properties, of craft, of authorship.</p><p>an (in)direct link to lucier, for sure.</p>`},
{label:'47',html:`<p>i see doubt as one of the main driving forces behind knowledge and, consequently, creativity. by asking ourselves, “what am i?”, we confront the age-old question “to be or not to be” — we define our position in relation to what we allow ourselves to recognize as part of ourselves and what we do not.</p><p>i see only one possible answer to this question: to doubt. it is not a matter of choice — it is a rhetorical question. somewhere between “to be” and “not to be” lies the doubting “i.”</p>`},
{label:'48',html:`<p>not-being is one of the states of being. “to be” and “not to be” are like inhaling and exhaling — and it does not really matter which is which; they are simultaneously both, condition one another, and outline the field of our existential and creative struggles.</p><p>in other words, “to be” and “not to be” are “i” and “i.” however, between inhalation and exhalation, between me and me, there is a space that separates one from the other and at the same time constitutes something third: a mysterious comma — the difference between one and the same.</p><p>it is precisely this difference that is doubt.</p>`},
{label:'49',html:`<p>the need for a creative act arises from doubt, from a sense that what exists is insufficient — or, more precisely, that it has not fully revealed itself. this is not disappointment in what exists, nor is it a rejection of it. it is creative doubt.</p>`},
{label:'50',html:`<p>doubt expands knowledge. every new text (including a musical one) is a chink in the a priori sum of texts — a certain potentiality of texts that exists independently of our will. through such chinks we come to know this sum, just as scientists come to know the properties of matter through a tiny specimen under a microscope.</p><p>a new composition does not add to this sum — it expands our understanding of it. it is already inherent in this sum.</p>`},
{label:'51',html:`<p>the self-referential, autopoietic world that reveals itself before us (within us), with its closed communicative connections, does not deny the possibility of the other: the other existing, thinking, knowing, and creating in parallel — not in dialogue, but in a dilogue, a polylogue — a sum of monologues unfolding, each in its own dimension.</p><p>thus, the other manifests itself through its absence. much like a japanese rock garden, arranged in such a way that one of the stones is hidden by the others from every vantage point. it is precisely this “absent” stone that becomes the purpose and content of the art of arranging the garden.</p>`}
].map(card=>({...card,plain:card.html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}));
const game=document.getElementById('game'),loading=document.getElementById('loading'),hint=document.getElementById('hint'),count=document.getElementById('count'),total=document.getElementById('total'),end=document.getElementById('end');
let introCard=null,deck=[],order=[],pos=0,current=null,ready=false;
function decodeBase64(s){const bin=atob(s.replace(/\n/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function extractCard(section){return{label:section.dataset.label||'—',html:section.querySelector('.text-wrap')?.innerHTML||'',plain:section.querySelector('.text-wrap')?.innerText.trim()||''}}
function renumber(cards){return cards.map(card=>{if(card.label==='00')return card;if(card.label==='Intro')return {...card,label:'01'};if(/^\d+$/.test(card.label)){const n=parseInt(card.label,10);if(n>=1)return {...card,label:String(n+1).padStart(2,'0')}}return card})}
function shuffle(){order=[...deck];for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0}
function render(card,isZero=false){end.classList.remove('show');game.querySelector('.card')?.remove();const el=document.createElement('section');el.className='card';const short=card.plain.length<420?' short':'';let html=card.html;if(isZero)html='<h1 class="diary-title">Thoughts &amp; Quotes<span>Interactive Diary</span></h1>'+html+'<p><br><strong>how to read:</strong> tap or click anywhere on the screen to draw a page. pages appear in random order and never repeat until the deck is exhausted.</p>';el.innerHTML='<div class="ghost">'+card.label+'</div><div class="rail"><div class="label">'+card.label+'</div><div class="line"></div></div><div class="text'+short+'">'+html+'</div>';game.appendChild(el);count.textContent=card.label;current=card}
function next(){if(!ready)return;if(pos>=order.length){game.querySelector('.card')?.remove();end.classList.add('show');hint.textContent='deck complete';return}render(order[pos++]);hint.textContent=pos===order.length?'tap / click once more to finish':'tap / click anywhere to draw'}
function restart(e){e?.stopPropagation();shuffle();render(introCard,true);hint.textContent='tap / click anywhere to draw'}
fetch(SOURCE,{headers:{'Accept':'application/vnd.github+json'}}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{const doc=new DOMParser().parseFromString(decodeBase64(data.content),'text/html');const cards=renumber([...doc.querySelectorAll('.text-panel')].map(extractCard));introCard=cards.find(c=>c.label==='00');deck=[...cards.filter(c=>c.label!=='00'),...NEW_CARDS];total.textContent=String(deck.length).padStart(2,'0');shuffle();loading.remove();render(introCard,true);ready=true}).catch(()=>{loading.textContent='could not load thoughts';hint.textContent='please reload'});
document.addEventListener('click',e=>{if(e.target.closest('.global-site-nav'))return;if(e.target.closest('.download-pdf'))return;if(e.target.closest('#reshuffle'))return restart(e);if(end.classList.contains('show'))return;next()});
document.addEventListener('keydown',e=>{if([' ','Enter','ArrowRight'].includes(e.key)){if(end.classList.contains('show'))return;e.preventDefault();next()}});
</script>
