<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dmitri Kourliandski — Thoughts & Quotes</title>
<meta name="description" content="Thoughts & Quotes by Dmitri Kourliandski">
<link rel="icon" type="image/png" sizes="32x32" href="/main-favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/main-favicon-16.png?v=2">
<link rel="shortcut icon" href="/main-favicon.ico?v=2">
<style id="thoughts-game-css">
:root{--bg:#f2eee6;--ink:#11110f;--muted:#777066;--sitebar-h:46px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.global-site-nav{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--sitebar-h);display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 4vw;border-bottom:1px solid rgba(0,0,0,.13);background:rgba(242,238,230,.96);backdrop-filter:blur(10px);font-size:11px;line-height:1;letter-spacing:.09em;text-transform:uppercase}
.global-site-nav a{color:inherit;text-decoration:none;white-space:nowrap}.global-site-nav a:hover{opacity:.55}.nav-right{display:flex;gap:18px;align-items:center}
main{position:fixed;inset:var(--sitebar-h) 0 0 0;cursor:pointer}
.card{position:absolute;inset:0;display:grid;grid-template-columns:minmax(70px,11vw) minmax(0,1fr);align-items:center;padding:7vh 5vw;overflow:auto}
.rail{align-self:stretch;display:flex;flex-direction:column;position:relative;z-index:2}.label{font-size:12px;letter-spacing:.15em;color:var(--muted)}.line{width:1px;background:rgba(0,0,0,.2);flex:1;margin:18px 0 0 4px}
.ghost{position:absolute;right:-.04em;bottom:-.18em;font-size:clamp(180px,38vw,570px);line-height:.75;font-weight:700;letter-spacing:-.08em;color:rgba(0,0,0,.035);pointer-events:none;user-select:none}
.text{width:min(900px,92%);position:relative;z-index:2}.text p{margin:0 0 1em;font-size:clamp(21px,2.25vw,34px);line-height:1.44;letter-spacing:-.018em}.text p:last-child{margin-bottom:0}.text.short p{font-size:clamp(30px,4vw,60px);line-height:1.2}
.counter{position:fixed;right:20px;top:calc(var(--sitebar-h) + 18px);z-index:30;font-size:11px;letter-spacing:.12em;color:var(--muted)}
.hint{position:fixed;left:5vw;bottom:22px;z-index:30;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center}.end.show{display:flex}.end-title{font-size:clamp(70px,15vw,190px);line-height:.8;font-weight:700;letter-spacing:-.08em}.end button{margin-top:32px;border:1px solid rgba(0,0,0,.24);background:transparent;padding:11px 18px;font:inherit;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
@media(max-width:760px){:root{--sitebar-h:44px}.global-site-nav{padding:0 16px;gap:12px}.nav-right{gap:11px}.nav-right a:nth-child(3),.nav-right a:nth-child(4){display:none}.card{grid-template-columns:38px 1fr;padding:7vh 20px 58px 16px}.text{width:100%}.text p{font-size:clamp(17px,4.5vw,19px);line-height:1.5}.ghost{font-size:52vw;bottom:-.08em}.hint{left:16px;bottom:14px}}
</style>
</head>
<body>
<nav class="global-site-nav" aria-label="Site navigation"><a href="index.html">Dmitri Kourliandski</a><div class="nav-right"><a href="works.html">works</a><a href="releases.html">releases</a><a href="bibliography.html">bibliography</a><a href="thoughts.html">thoughts</a><a href="index.html#contact">contact</a></div></nav>
<div class="counter"><span id="count">00</span> / <span id="total">—</span></div>
<main id="game"><div class="loading" id="loading">loading thoughts…</div><div class="end" id="end"><div><div class="end-title">END</div><button id="reshuffle" type="button">reshuffle</button></div></div></main>
<div class="hint" id="hint">tap / click anywhere to draw</div>
<script>
const SOURCE='https://api.github.com/repos/kourliandski/kourliandski.com/git/blobs/1b9231d4bbb24a7ce63c44624428e274f5ebd94f';
const game=document.getElementById('game'),loading=document.getElementById('loading'),hint=document.getElementById('hint'),count=document.getElementById('count'),total=document.getElementById('total'),end=document.getElementById('end');
let introCard=null,deck=[],order=[],pos=0,current=null,ready=false;
function decodeBase64(s){const bin=atob(s.replace(/\n/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function extractCard(section){return{label:section.dataset.label||'—',html:section.querySelector('.text-wrap')?.innerHTML||'',plain:section.querySelector('.text-wrap')?.innerText.trim()||''}}
function shuffle(){order=[...deck];for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0}
function render(card,isZero=false){end.classList.remove('show');game.querySelector('.card')?.remove();const el=document.createElement('section');el.className='card';const short=card.plain.length<420?' short':'';let html=card.html;if(isZero)html += '<p><br><strong>how to read:</strong> tap or click anywhere on the screen to draw a page. pages appear in random order and never repeat until the deck is exhausted. <em>Intro</em> is part of the deck.</p>';el.innerHTML='<div class="ghost">'+card.label+'</div><div class="rail"><div class="label">'+card.label+'</div><div class="line"></div></div><div class="text'+short+'">'+html+'</div>';game.appendChild(el);count.textContent=card.label;current=card}
function next(){if(!ready)return;if(pos>=order.length){game.querySelector('.card')?.remove();end.classList.add('show');hint.textContent='deck complete';return}render(order[pos++]);hint.textContent=pos===order.length?'tap / click once more to finish':'tap / click anywhere to draw'}
function restart(e){e?.stopPropagation();shuffle();render(introCard,true);hint.textContent='tap / click anywhere to draw'}
fetch(SOURCE,{headers:{'Accept':'application/vnd.github+json'}}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{const doc=new DOMParser().parseFromString(decodeBase64(data.content),'text/html');const cards=[...doc.querySelectorAll('.text-panel')].map(extractCard);introCard=cards.find(c=>c.label==='00');deck=cards.filter(c=>c.label!=='00');total.textContent=String(deck.length).padStart(2,'0');shuffle();loading.remove();render(introCard,true);ready=true}).catch(()=>{loading.textContent='could not load thoughts';hint.textContent='please reload'});
document.addEventListener('click',e=>{if(e.target.closest('.global-site-nav'))return;if(e.target.closest('#reshuffle'))return restart(e);if(end.classList.contains('show'))return;next()});
document.addEventListener('keydown',e=>{if([' ','Enter','ArrowRight'].includes(e.key)){if(end.classList.contains('show'))return;e.preventDefault();next()}});
</script>
</body>
</html>
