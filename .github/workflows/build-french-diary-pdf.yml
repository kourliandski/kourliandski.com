name: Build French diary PDF
on:
  push:
    branches: [main]
    paths:
      - 'fr/thoughts-fr-*.js'
      - '.github/workflows/build-french-diary-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - name: Update diary sources
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('fr/thoughts-fr-1.js')
          s=p.read_text(encoding='utf-8').replace('Une loterie sans possibilité de perdre', 'Une loterie sans possibilité de gagner')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build PDF
        run: |
          cat > /tmp/build_pdf.py <<'PY'
          import re, html
          from pathlib import Path
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import ParagraphStyle
          from reportlab.lib.enums import TA_LEFT
          from reportlab.lib.colors import HexColor
          from reportlab.platypus import SimpleDocTemplate, Paragraph, PageBreak, Spacer
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          font='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'; bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'; italic='/usr/share/fonts/truetype/dejavu/DejaVuSans-Oblique.ttf'
          pdfmetrics.registerFont(TTFont('DV',font)); pdfmetrics.registerFont(TTFont('DVB',bold)); pdfmetrics.registerFont(TTFont('DVI',italic))
          cards={}
          for f in sorted(Path('fr').glob('thoughts-fr-*.js')):
              s=f.read_text(encoding='utf-8')
              for m in re.finditer(r"'(\d{2})':`(.*?)`(?=,\n'|\n\}\);|,?\s*$)",s,re.S): cards[m.group(1)]=m.group(2)
          def plain(s):
              s=re.sub(r'<[^>]+>','',s)
              return html.unescape(s).replace('&','&amp;').replace('<','&lt;').replace('>','&gt;').replace('\n',' ').strip()
          def paras(s):
              ps=re.findall(r'<p[^>]*>(.*?)</p>',s,re.S)
              return [plain(p) for p in ps if plain(p)] or [plain(s)]
          out='fr/reflexions-et-citations.pdf'
          doc=SimpleDocTemplate(out,pagesize=A4,rightMargin=52,leftMargin=52,topMargin=54,bottomMargin=54,title='Réflexions & citations — Dmitri Kourliandski',author='Dmitri Kourliandski')
          title=ParagraphStyle('title',fontName='DVB',fontSize=30,leading=32,spaceAfter=12,textColor=HexColor('#11110f')); sub=ParagraphStyle('sub',fontName='DV',fontSize=10,leading=14,spaceAfter=10,textColor=HexColor('#777066')); note=ParagraphStyle('note',fontName='DVI',fontSize=9,leading=12,spaceAfter=28,textColor=HexColor('#777066')); intro=ParagraphStyle('intro',fontName='DV',fontSize=11.5,leading=17,alignment=TA_LEFT,textColor=HexColor('#11110f')); num=ParagraphStyle('num',fontName='DVB',fontSize=10,leading=12,spaceAfter=12,textColor=HexColor('#777066')); body=ParagraphStyle('body',fontName='DV',fontSize=11.5,leading=17,alignment=TA_LEFT,textColor=HexColor('#11110f'))
          story=[Paragraph('RÉFLEXIONS &amp; CITATIONS',title),Paragraph('Dmitri Kourliandski · 2002—2026 · version française',sub),Paragraph('Traduction automatique de l’anglais.',note)]
          ps=paras(cards['00'])
          for j,p in enumerate(ps):
              story.append(Paragraph(p,intro))
              if j<len(ps)-1: story.append(Spacer(1,9))
          story.append(PageBreak())
          keys=[k for k in sorted(cards) if k!='00']
          for i,k in enumerate(keys):
              story.append(Paragraph(k,num)); ps=paras(cards[k])
              for j,p in enumerate(ps):
                  story.append(Paragraph(p,body))
                  if j<len(ps)-1: story.append(Spacer(1,9))
              if i<len(keys)-1: story.append(PageBreak())
          def footer(c,d):
              c.saveState(); c.setFont('DV',8); c.setFillColor(HexColor('#777066')); c.drawString(52,28,'Dmitri Kourliandski — Réflexions & citations'); c.restoreState()
          doc.build(story,onFirstPage=footer,onLaterPages=footer)
          assert len(cards)==53, f'Expected 53 cards, got {len(cards)}'
          PY
          python /tmp/build_pdf.py
      - name: Commit diary and PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fr/thoughts-fr-1.js fr/reflexions-et-citations.pdf
          git diff --cached --quiet || (git commit -m 'Update French diary PDF' && git push)
