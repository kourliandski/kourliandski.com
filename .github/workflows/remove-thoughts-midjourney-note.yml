name: Remove thoughts Midjourney note

on:
  push:
    paths:
      - '.github/workflows/remove-thoughts-midjourney-note.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove sentence and workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('thoughts.html')
          s = p.read_text()
          target = 'the illustrations, created using the midjourney neural network, follow free associations that are, to varying degrees, connected - or disconnected - from the corresponding texts.'
          if target not in s:
              # Also accept typographic/capitalization variants while removing only the sentence.
              import re
              pattern = re.compile(r'the illustrations, created using the midjourney neural network, follow free associations that are, to varying degrees, connected\s*[-–—]\s*or disconnected\s*[-–—]\s*from the corresponding texts\.', re.I)
              s2, n = pattern.subn('', s, count=1)
              if not n:
                  raise SystemExit('Target sentence not found')
              s = s2
          else:
              s = s.replace(target, '', 1)
          p.write_text(s)
          Path('.github/workflows/remove-thoughts-midjourney-note.yml').unlink()
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Midjourney note from thoughts"
          git push
