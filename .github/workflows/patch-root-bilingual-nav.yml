name: Patch internal headers
on:
  push:
    paths:
      - '.github/workflows/patch-root-bilingual-nav.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch headers
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re

          pages = ['works.html', 'releases.html', 'bibliography.html', 'thoughts.html']
          for name in pages:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              nav = f'''<nav class="global-site-nav" aria-label="Site navigation">
            <a href="/">Dmitri Kourliandski</a>
            <div class="nav-right">
              <a href="/biography.html">biography</a>
              <a href="/#archive">archive</a>
              <a href="/#contact">contact</a>
              <a class="root-fr-switch" href="/fr/{name}" onclick="localStorage.setItem('siteLanguage','fr')">FR</a>
            </div>
          </nav>'''
              s, count = re.subn(r'<nav class="global-site-nav"[^>]*>[\s\S]*?</nav>', nav, s, count=1)
              if count != 1:
                  raise SystemExit(f'nav not found: {name}')
              s = re.sub(r'\.global-site-nav \.nav-right a:nth-child\(3\),\s*\.global-site-nav \.nav-right a:nth-child\(4\)\{display:none!?[^}]*\}', '', s)
              s = s.replace('.global-site-nav .nav-right a:nth-child(3),.global-site-nav .nav-right a:nth-child(4){display:none!important}', '')
              p.write_text(s, encoding='utf-8')
          PY
          python3 /tmp/patch.py
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works.html releases.html bibliography.html thoughts.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update internal page headers directly"
          git push