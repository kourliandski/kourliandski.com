name: Patch root bilingual navigation
on:
  push:
    paths:
      - '.github/workflows/patch-root-bilingual-nav.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply unified header directly to internal source pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages=['works.html','releases.html','bibliography.html','thoughts.html']
          for name in pages:
              p=Path(name); s=p.read_text(encoding='utf-8')
              nav=f'''<nav class="global-site-nav" aria-label="Site navigation">
  <a href="/">Dmitri Kourliandski</a>
  <div class="nav-right">
    <a href="/biography.html">biography</a>
    <a href="/#archive">archive</a>
    <a href="/#contact">contact</a>
    <a class="root-fr-switch" href="/fr/{name}" onclick="localStorage.setItem('siteLanguage','fr')">FR</a>
  </div>
</nav>'''
              s,n=re.subn(r'<nav class="global-site-nav"[^>]*>[\s\S]*?</nav>',nav,s,count=1)
              if not n:
                  raise RuntimeError(f'Navigation not found in {name}')
              # Replace old mobile rules that hid nav items; all four links must remain visible.
              css='''<style id="bilingual-root-nav">.global-site-nav,.global-site-nav a{font-size:11px!important;letter-spacing:.09em!important}.global-site-nav .nav-right{display:flex!important;align-items:center!important;gap:18px!important}.global-site-nav .root-fr-switch{display:inline-block!important;border-left:1px solid rgba(0,0,0,.2);padding-left:16px;font-weight:700;white-space:nowrap}@media(max-width:760px){.global-site-nav{padding:0 10px!important;gap:6px!important;max-width:100%;overflow:hidden}.global-site-nav>a:first-child{font-size:8px!important;line-height:1.1!important;max-width:none!important;white-space:nowrap!important;flex-shrink:0}.global-site-nav .nav-right{gap:7px!important;margin-left:auto!important;min-width:0}.global-site-nav .nav-right a{display:inline-block!important;font-size:8px!important;letter-spacing:.05em!important}.global-site-nav .root-fr-switch{padding-left:6px!important;font-size:9px!important;letter-spacing:.07em!important}}</style>'''
              if 'id="bilingual-root-nav"' in s:
                  s=re.sub(r'<style id="bilingual-root-nav">[\s\S]*?</style>',css,s,count=1)
              else:
                  s=s.replace('</head>',css+'</head>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works.html releases.html bibliography.html thoughts.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use unified header on internal source pages"
          git push