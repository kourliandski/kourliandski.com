name: Add compilations releases

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add compilations section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('releases.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
            '<a href="#donemus-records">Donemus Records</a> / <a href="#col-legno">col legno</a>',
            '<a href="#donemus-records">Donemus Records</a> / <a href="#col-legno">col legno</a> / <a href="#compilations">Compilations</a>',1)

          s=s.replace(
            '"col legno":"col-legno"',
            '"col legno":"col-legno","Compilations":"compilations"',1)

          entries='''{"group":"Compilations","title":"Schrift","year":"2017","artist":"Fanny Vicens — accordion · includes Shiver","source_url":"https://www.europadisc.co.uk/classical/147284/Schrift%3A_Contemporary_Accordion_Music.htm","source_label":"Stradivarius STR37047","youtube":"https://www.youtube.com/results?search_query=Dmitri+Kourliandski+Fanny+Vicens+Shiver","youtube_direct":false,"cover":"compilation"},{"group":"Compilations","title":"Pythian Games Competition 2002–2005. Highlights","year":"2006","artist":"eNsemble of PRO ARTE Institute · includes Four Positions of One and the Same Object / 4 states of the same","source_url":"https://classical.music.apple.com/us/album/1531307437","source_label":"Melodiya · MEL CD 10 01056 · 2 CD","youtube":"https://www.youtube.com/results?search_query=Dmitri+Kourliandski+Pythian+Games+Four+Positions+One+Same+Object","youtube_direct":false,"cover":"compilation"},{"group":"Compilations","title":"One Minute More","year":"2008","artist":"Guy Livingston · DVD · includes Surface","source_url":"https://www.kourl.ru/media.html","source_label":"DVD · 5.1 sound","youtube":"https://www.youtube.com/results?search_query=Dmitri+Kourliandski+Surface+Guy+Livingston","youtube_direct":false,"cover":"compilation"},{"group":"Compilations","title":"OCCASION","year":"2004","artist":"Maria Fedotova · includes Astor Piazzolla: Ave Maria and Histoire du Tango, versions by Dmitri Kourliandski","source_url":"https://dom.com.ru/item/1027/","source_label":"Classical Records · CR-035","youtube":"https://www.youtube.com/results?search_query=Maria+Fedotova+Occasion+Kourliandski+Piazzolla","youtube_direct":false,"cover":"compilation"}'''
          needle='const releases = ['
          if '"group":"Compilations"' not in s:
              s=s.replace(needle, needle+entries+',',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.html
          git rm .github/workflows/add-compilations.yml
          git commit -m "Add compilations to releases"
          git push
