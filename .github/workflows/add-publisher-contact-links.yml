name: Add publisher contact links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add publisher links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          needle='<div class="socials">'
          links='<div class="socials"><a href="https://donemus.nl/composer/dmitri-kourliandski/" target="_blank" rel="noopener">donemus ↗</a><a href="https://www.henry-lemoine.com/fr/compositeurs/304-dmitri-kourliandski" target="_blank" rel="noopener">éditions jobert / henry lemoine ↗</a>'
          if 'donemus.nl/composer/dmitri-kourliandski/' not in s:
              if needle not in s: raise SystemExit('socials block not found')
              s=s.replace(needle,links,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add publisher links to contact"
          git push
