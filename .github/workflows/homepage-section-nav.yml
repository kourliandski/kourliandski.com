name: Homepage mobile navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('  nav a:nth-child(2),\n  nav a:nth-child(3),\n  nav a:nth-child(4){display:none}\n','')
          s=s.replace('@media(max-width:700px){.current-projects','@media(max-width:700px){header{justify-content:center}.brand{display:none}nav{width:100%;justify-content:space-between;gap:7px;font-size:9px}}\n@media(max-width:700px){.current-projects',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show all homepage navigation on mobile"
          git push
