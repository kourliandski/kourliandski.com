name: Homepage section navigation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update navigation
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); a=s.index('  <nav>'); b=s.index('  </nav>',a)+len('  </nav>'); n='  <nav>\n    <a href=\"#bio\">bio</a>\n    <a href=\"#current-projects\">projects</a>\n    <a href=\"#archive\">archive</a>\n    <a href=\"#contact\">contact</a>\n    <a href=\"https://www.kourliandski.com/radio-espaces-bruts\" target=\"_blank\" rel=\"noopener\">radio</a>\n  </nav>'; s=s[:a]+n+s[b:]; s=s.replace('<section class=\"links\" aria-label=\"Site sections\">','<section class=\"links\" id=\"archive\" aria-label=\"Site sections\">',1); p.write_text(s)"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use section navigation on homepage"
          git push
