name: Homepage section numbering

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Number homepage sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="current-projects-label">CURRENT PROJECTS</div>','<div class="current-projects-label">02 / current projects</div>',1)
          s=s.replace('<section class="links" id="archive" aria-label="Site sections">','<section class="links" id="archive" aria-label="Site sections">\n    <div class="section-no archive-label">03 / archive</div>',1)
          s=s.replace('<div class="n">02</div><div class="title">works</div>','<div class="n"></div><div class="title">works</div>',1)
          s=s.replace('<div class="n">03</div><div class="title">releases</div>','<div class="n"></div><div class="title">releases</div>',1)
          s=s.replace('<div class="n">04</div><div class="title">bibliography</div>','<div class="n"></div><div class="title">bibliography</div>',1)
          s=s.replace('<div class="n">05</div><div class="title">thoughts &amp; quotes</div>','<div class="n"></div><div class="title">thoughts &amp; quotes</div>',1)
          s=s.replace('<div class="n">06</div><div class="title">radio espaces bruts</div>','<div class="n"></div><div class="title">radio espaces bruts</div>',1)
          s=s.replace('<div class="section-no">07 / contact</div>','<div class="section-no">04 / contact</div>',1)
          if '.archive-label{' not in s:
              s=s.replace('.links{\n  padding:0 28px;\n}','.links{\n  padding:0 28px;\n}\n.archive-label{padding:28px 0 8px}',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Number homepage sections consistently"
          git push
