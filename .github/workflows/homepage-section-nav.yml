name: Align homepage section labels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align section labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="current-projects-label">02 / current projects</div>','<div class="section-no current-projects-label">02 / current projects</div>',1)
          s=s.replace('.current-projects-label{margin-bottom:30px;font-size:11px;letter-spacing:.12em}', '.current-projects-label{margin-bottom:30px}',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Align homepage section labels"
          git push
