name: Homepage anchor offset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix anchor offset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          desktop='#bio,#current-projects,#archive,#contact{scroll-margin-top:58px}\n'
          mobile='  #bio,#current-projects,#archive,#contact{scroll-margin-top:54px}\n'
          if desktop not in s:
              s=s.replace('html{scroll-behavior:smooth}\n','html{scroll-behavior:smooth}\n'+desktop,1)
          if mobile not in s:
              s=s.replace('@media(max-width:900px){\n','@media(max-width:900px){\n'+mobile,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Offset homepage anchors below fixed header"
          git push
