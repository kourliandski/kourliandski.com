name: Add Formspree contact form

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add contact form
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''\n.contact-form{max-width:760px;width:100%;margin:6vh 0 7vh}\n.contact-form input,.contact-form textarea{display:block;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;padding:16px 0;outline:none}\n.contact-form textarea{min-height:140px;resize:vertical}\n.contact-form input:focus,.contact-form textarea:focus{border-bottom-color:var(--ink)}\n.contact-form button{margin-top:24px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:12px 18px;cursor:pointer}\n.contact-form button:hover{background:var(--ink);color:var(--bg)}\n.contact-email{font-size:12px;letter-spacing:.06em;margin-top:18px}\n'''
          if '.contact-form{' not in s:
              s=s.replace('.contact-bottom{\n',css+'\n.contact-bottom{\n',1)
          old='''    <div class="section-no">04 / contact</div>\n    \n    <div class="contact-bottom">\n      <div>\n        <a class="email" href="mailto:kourliandski@gmail.com">kourliandski@gmail.com ↗</a>\n        <div class="socials">'''
          new='''    <div class="section-no">04 / contact</div>\n\n    <form class="contact-form" action="https://formspree.io/f/xzebqlpw" method="POST">\n      <input type="text" name="name" placeholder="Name" autocomplete="name">\n      <input type="email" name="email" placeholder="Email" autocomplete="email" required>\n      <textarea name="message" placeholder="Message" required></textarea>\n      <button type="submit">Send</button>\n      <div class="contact-email">kourliandski @ gmail . com</div>\n    </form>\n\n    <div class="contact-bottom">\n      <div>\n        <div class="socials">'''
          if old not in s:
              raise SystemExit('contact block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Formspree contact form"
          git push
