name: Ensure unified site header
on:
  push:
    paths:
      - '.github/workflows/ensure-unified-header.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify homepage navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<nav><a href="#bio">bio</a><a href="#projects">projects</a><a href="#archive">archive</a><a href="#contact">contact</a></nav>', '<nav><a href="/biography.html">biography</a><a href="#archive">archive</a><a href="#contact">contact</a></nav>')
          p.write_text(s)

          p=Path('fr/index.html')
          s=p.read_text()
          s=s.replace('<nav><a href="#bio">bio</a><a href="#projects">projets</a><a href="#archive">archives</a><a href="#contact">contact</a></nav>', '<nav><a href="/fr/biography.html">biographie</a><a href="#archive">archives</a><a href="#contact">contact</a></nav>')
          p.write_text(s)
          PY
      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fr/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Unify homepage headers"
            git push
          fi
