name: Reorder releases sections

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reorder:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder release groups
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('releases.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<p>Bandcamp / FANCYMUSIC / Donemus Records / col legno</p>', '<p>col legno / FANCYMUSIC / Donemus Records / Bandcamp</p>')
          old='const groups=["Dmitri Kourliandski 2.0 — Bandcamp","FANCYMUSIC","Donemus Records","col legno"];'
          new='const groups=["col legno","FANCYMUSIC","Donemus Records","Dmitri Kourliandski 2.0 — Bandcamp"];'
          if old not in s:
              raise SystemExit('groups array not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.html
          git rm .github/workflows/reorder-releases.yml
          git commit -m "Reorder releases sections"
          git push
