name: Remove radio from site headers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove radio header links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['index.html','works.html','releases.html','bibliography.html','thoughts.html','biography.html']
          snippets=[
            '<a href="https://www.kourliandski.com/radio-espaces-bruts" target="_blank" rel="noopener">radio</a>',
            '<a href="https://www.kourliandski.com/radio-espaces-bruts" target="_blank" rel="noopener">radio</a>\n'
          ]
          for fn in files:
              p=Path(fn)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              for x in snippets:
                  s=s.replace(x,'')
              p.write_text(s,encoding='utf-8')
          Path('.github/workflows/remove-radio-from-headers.yml').unlink(missing_ok=True)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove radio from headers"
          git push
