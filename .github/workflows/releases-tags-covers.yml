name: Add active release tags

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update releases page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('releases.html')
          s=p.read_text(encoding='utf-8')

          if 'header p a{' not in s:
              s=s.replace(
                  'header p{margin:16px 0 0;color:var(--muted)}',
                  'header p{margin:16px 0 0;color:var(--muted)}\nheader p a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}\nheader p a:hover{color:var(--ink);border-bottom-color:var(--ink)}',
                  1
              )

          s=s.replace(
              '<p>Bandcamp / FANCYMUSIC / Donemus Records / col legno</p>',
              '<p><a href="#bandcamp">Bandcamp</a> / <a href="#fancymusic">FANCYMUSIC</a> / <a href="#donemus-records">Donemus Records</a> / <a href="#col-legno">col legno</a></p>',
              1
          )

          marker="const groups="
          insert='const sectionIds={"Dmitri Kourliandski 2.0 — Bandcamp":"bandcamp","FANCYMUSIC":"fancymusic","Donemus Records":"donemus-records","col legno":"col-legno"};\n'
          if 'const sectionIds=' not in s:
              s=s.replace(marker, insert+marker, 1)

          old="const sec=document.createElement('section');\n sec.innerHTML=`<h2>${esc(g)}</h2><div class=\"grid\">${rows.map(r=>card(r,idx++)).join('')}</div>`;"
          new="const sec=document.createElement('section');\n sec.id=sectionIds[g]||'';\n sec.style.scrollMarginTop='58px';\n sec.innerHTML=`<h2>${esc(g)}</h2><div class=\"grid\">${rows.map(r=>card(r,idx++)).join('')}</div>`;"
          if old in s:
              s=s.replace(old,new,1)
          elif "sec.id=sectionIds[g]||'';" not in s:
              raise SystemExit('section render block not found')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.html
          git rm .github/workflows/releases-tags-covers.yml
          git commit -m "Add active release tags"
          git push
