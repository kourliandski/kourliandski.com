name: Maintain releases page
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep releases page complete
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('releases.html')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'const releases = (\[.*?\]);\s*const groups=',s,re.S)
          if not m: raise SystemExit('release array not found')
          releases=json.loads(m.group(1))
          wanted=[
            {"group":"col legno","title":"Negative Modulations","artist":"Dmitri Kourliandski","source_url":"https://www.col-legno.com/en/shop/20426-dmitri-kourliandski-negative-modulations","source_label":"col legno","youtube":"https://www.youtube.com/results?search_query=Dmitri+Kourliandski+%22Negative+Modulations%22","youtube_direct":False,"cover":"col-legno","cover_url":"https://api.microlink.io/?url=https%3A%2F%2Fwww.col-legno.com%2Fen%2Fshop%2F20426-dmitri-kourliandski-negative-modulations&embed=image.url"},
            {"group":"Compilations","title":"Sound Review 3/6","year":"2020","artist":"Various Artists · includes Dmitri Kourliandski — Punctuation Marks","source_url":"https://melody.su/en/catalog/classic/48652/","source_label":"Melodiya","youtube":"https://www.youtube.com/results?search_query=Dmitri+Kourliandski+Punctuation+Marks+Sound+Review+3%2F6","youtube_direct":False,"cover":"external","cover_url":"https://api.microlink.io/?url=https%3A%2F%2Fmelody.su%2Fen%2Fcatalog%2Fclassic%2F48652%2F&embed=image.url"},
            {"group":"Compilations","title":"Fermata. Compiled by Alexey Munipov","year":"2019","artist":"Various Artists · includes Dmitri Kourliandski — The Anatomy of Pain","source_url":"https://fancymusic.bandcamp.com/album/fermata-compiled-by-alexey-munipov","source_label":"Bandcamp","youtube":"https://www.youtube.com/results?search_query=Dmitri+Kourliandski+%22The+Anatomy+of+Pain%22","youtube_direct":False,"cover":"bandcamp","cover_url":"https://f4.bcbits.com/img/a4030484649_10.jpg"},
            {"group":"Compilations","title":"Sorokin Trip","year":"2019","artist":"Various Artists · includes Dmitri Kourliandski — Shiver","source_url":"https://www.qobuz.com/us-en/album/sorokin-trip-various-artists/tsz8mwlpbasrc","source_label":"Qobuz","youtube":"https://www.youtube.com/results?search_query=Dmitri+Kourliandski+Shiver+Sergej+Tchirkov","youtube_direct":False,"cover":"external","cover_url":"https://api.microlink.io/?url=https%3A%2F%2Fwww.qobuz.com%2Fus-en%2Falbum%2Fsorokin-trip-various-artists%2Ftsz8mwlpbasrc&embed=image.url"},
            {"group":"Compilations","title":"Selected Works Of EMA Expo","year":"2017","artist":"Various Artists · includes Dmitri Kourliandski + Andrey Guryanov (KGXXX)","source_url":"https://kotae.bandcamp.com/album/selected-works-of-ema-expo","source_label":"Bandcamp","youtube":"https://www.youtube.com/results?search_query=Dmitri+Kourliandski+Andrey+Guryanov+KGXXX+EMA+Expo","youtube_direct":False,"cover":"bandcamp","cover_url":"https://f4.bcbits.com/img/a3561313556_5.jpg"},
            {"group":"Compilations","title":"Schrift","year":"2017","artist":"Fanny Vicens · includes Dmitri Kourliandski — Shiver","source_url":"https://classical.music.apple.com/ua/album/1187451519","source_label":"Apple Music","youtube":"https://www.youtube.com/results?search_query=Dmitri+Kourliandski+Fanny+Vicens+Shiver","youtube_direct":False,"cover":"external","cover_url":"https://api.microlink.io/?url=https%3A%2F%2Fclassical.music.apple.com%2Fua%2Falbum%2F1187451519&embed=image.url"},
            {"group":"Compilations","title":"Пифийские игры 2002–2005. Избранное","year":"2006","artist":"Various Artists · includes Dmitri Kourliandski — Four States of Same","source_url":"https://melody.su/en/catalog/classic/438/","source_label":"Melodiya","youtube":"https://www.youtube.com/results?search_query=Dmitri+Kourliandski+Four+States+of+Same+Pythian+Games","youtube_direct":False,"cover":"external","cover_url":"https://api.microlink.io/?url=https%3A%2F%2Fmusic.apple.com%2Fus%2Falbum%2Fpythian-games-competition-2002-2005-highlights-live%2F1531307437&embed=image.url"}
          ]
          bykey={(r.get('group'),r.get('title')):r for r in releases}
          for item in wanted:
              key=(item['group'],item['title'])
              if key in bykey: bykey[key].update(item)
              else:
                  releases.append(item); bykey[key]=item
          order=['col legno','Dmitri Kourliandski 2.0 — Bandcamp','FANCYMUSIC','Donemus Records','Compilations']
          releases.sort(key=lambda r:(order.index(r.get('group')) if r.get('group') in order else 99,-int(r.get('year') or 0) if r.get('group')=='Compilations' else 0))
          arr=json.dumps(releases,ensure_ascii=False,separators=(',',':'))
          s=s[:m.start(1)]+arr+s[m.end(1):]
          s=re.sub(r'const groups=\[.*?\];','const groups=["col legno","Dmitri Kourliandski 2.0 — Bandcamp","FANCYMUSIC","Donemus Records","Compilations"];',s,count=1)
          s=re.sub(r'\n?<p>Bandcamp / FANCYMUSIC / Donemus Records(?: / col legno)?(?: / compilations)?</p>','',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes if needed
        run: |
          if git diff --quiet -- releases.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.html
          git commit -m "Maintain complete releases page"
          git push
