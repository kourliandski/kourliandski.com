name: Connect favicon
on:
  push:
    paths: ['.github/workflows/connect-favicon.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect favicon to HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag='<link rel="icon" type="image/png" href="/favicon.png">'
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              if 'rel="icon"' in s or "rel='icon'" in s: continue
              i=s.lower().find('</head>')
              if i>=0:
                  s=s[:i]+tag+'\n'+s[i:]
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/connect-favicon.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Connect favicon across site" || exit 0
          git push
