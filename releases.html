const groups=['col legno','Dmitri Kourliandski 2.0 — Bandcamp','FANCYMUSIC','Donemus Records','Compilations'];
const additions=[

];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function decode64(s){const bin=atob(s.replace(/\n/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function card(r,i){const mainLink=r.bandcamp||r.source_url||r.youtube||'#';let buttons='';if(r.bandcamp)buttons+=`<a href="${r.bandcamp}" target="_blank" rel="noopener">Bandcamp</a>`;if(r.source_url)buttons+=`<a href="${r.source_url}" target="_blank" rel="noopener">${esc(r.source_label||'Source')}</a>`;if(r.youtube)buttons+=`<a class="${r.youtube_direct?'':'search'}" href="${r.youtube}" target="_blank" rel="noopener">${r.youtube_direct?'YouTube':'YouTube ⌕'}</a>`;const cover=r.cover_url?`<a class="cover" href="${mainLink}" target="_blank" rel="noopener"><div class="fallback">${esc(r.title)}</div><img src="${r.cover_url}" alt="${esc(r.title)} cover" loading="lazy" onload="this.parentElement.classList.add('loaded')" onerror="this.style.display='none';this.parentElement.classList.remove('loaded')"></a>`:`<a class="cover" href="${mainLink}" target="_blank" rel="noopener"><div class="fallback">${esc(r.title)}</div></a>`;return `<article class="card">${cover}<div class="info"><div class="title">${esc(r.title)}</div><div class="by">${esc([r.artist,r.year].filter(Boolean).join(' · '))}</div><div class="links">${buttons}</div></div></article>`}
function render(releases){const main=document.getElementById('main'),filters=document.getElementById('filters'),status=document.getElementById('status');status.remove();const sections=new Map();function showGroup(group){document.querySelectorAll('.filter-tag').forEach(btn=>btn.classList.toggle('active',btn.dataset.group===group));sections.forEach((sec,g)=>sec.classList.toggle('hidden',group!=='All'&&g!==group))}['All',...groups].forEach(g=>{const btn=document.createElement('button');btn.type='button';btn.className='filter-tag'+(g==='All'?' active':'');btn.dataset.group=g;btn.textContent=g==='Dmitri Kourliandski 2.0 — Bandcamp'?'Bandcamp / 2.0':g;btn.onclick=()=>showGroup(g);filters.appendChild(btn)});let idx=0;groups.forEach(g=>{const rows=releases.filter(r=>r.group===g);if(!rows.length)return;const sec=document.createElement('section');sec.innerHTML=`<h2>${esc(g)}</h2><div class="grid">${rows.map(r=>card(r,idx++)).join('')}</div>`;sections.set(g,sec);main.appendChild(sec)})}
(async()=>{try{const res=await fetch(`https://api.github.com/repos/kourliandski/kourliandski.com/git/blobs/${SOURCE_BLOB}`);if(!res.ok)throw new Error('source unavailable');const data=await res.json();const old=decode64(data.content);const m=old.match(/const releases = (\[.*?\]);\s*const groups/s);if(!m)throw new Error('release data not found');let releases=JSON.parse(m[1]);const colLegno=releases.find(r=>r.group==='col legno'&&r.title==='Negative Modulations');if(colLegno)colLegno.cover_url='https://i1.sndcdn.com/artworks-000036693138-h588eo-t500x500.jpg';for(const a of additions){if(!releases.some(r=>r.group===a.group&&r.title===a.title))releases.push(a)}releases.sort((a,b)=>a.group==='Compilations'&&b.group==='Compilations'?Number(b.year||0)-Number(a.year||0):0);render(releases)}catch(e){document.getElementById('status').textContent='Could not load releases. Please reload the page.';console.error(e)}})();
</script>
