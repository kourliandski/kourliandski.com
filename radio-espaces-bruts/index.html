<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESPACES BRUTS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
<video id="bgVideo" class="bg-video" autoplay muted loop playsinline preload="auto" disablepictureinpicture>
<source src="https://video.wixstatic.com/video/9c9f19_60f19be18fef4c9ca4a11308755c7dc8/480p/mp4/file.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<button id="fullscreenToggle" class="fullscreen-button" type="button" aria-label="Enter fullscreen">
  <svg id="enterFullscreenIcon" class="fullscreen-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
  </svg>
  <svg id="exitFullscreenIcon" class="fullscreen-icon is-hidden" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M9 4v5H4M15 4v5h5M20 15h-5v5M4 15h5v5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
  </svg>
</button>

<section class="panel">
<img class="logo" src="logo.svg" alt="Dmitri Kourliandski — Espaces Bruts">

<button id="toggle" type="button" aria-label="Play / Stop">
<span id="icon">▶</span>
</button>
</section>
</main>

<script>
const bgVideo = document.getElementById("bgVideo");

function startBackgroundVideo() {
  if (!bgVideo) return;
  bgVideo.muted = true;
  bgVideo.defaultMuted = true;
  bgVideo.volume = 0;
  bgVideo.controls = false;
  const p = bgVideo.play();
  if (p && typeof p.catch === "function") p.catch(() => {});
}

if (bgVideo) {
  startBackgroundVideo();
  bgVideo.addEventListener("loadeddata", startBackgroundVideo, { once: true });
  bgVideo.addEventListener("canplay", startBackgroundVideo, { once: true });

  // Safari can still block remote autoplay; the first user gesture starts it.
  document.addEventListener("pointerdown", startBackgroundVideo, { once: true, capture: true });
  document.addEventListener("touchstart", startBackgroundVideo, { once: true, capture: true });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && bgVideo.paused) startBackgroundVideo();
  });
}
</script>
<script src="player.js"></script>
</body>
</html>
